<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SmartBus - Passenger Login</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#101827;font-family:Arial;padding:20px}
.panel{background:white;width:min(440px,100%);padding:30px;border-radius:16px}
h1{color:#173b70;margin-top:0}
p{color:#657187}
input{width:100%;padding:12px;margin:7px 0 14px;border:1px solid #ccd3df;border-radius:8px;font-size:15px}
button{width:100%;padding:12px;border:0;border-radius:8px;background:#16834a;color:white;font-weight:bold;cursor:pointer;margin-top:8px}
.section{margin-top:22px;padding-top:15px;border-top:1px solid #e3e7ed}
#message{margin-top:12px;color:#b42318;min-height:22px}
a{display:block;text-align:center;margin-top:18px;color:#1769aa}
</style>
</head>
<body>
<div class="panel">
<h1>Passenger Login</h1>
<p>Login with your registered passenger account.</p>

<form id="loginForm">
<input id="email" type="email" placeholder="Email address" required>
<input id="password" type="password" placeholder="Password" required>
<button type="submit">Passenger Login</button>
</form>

<div class="section">
<h3>New Passenger? Register</h3>
<form id="registerForm">
<input id="regName" placeholder="Full name" required>
<input id="regPhone" type="tel" maxlength="10" placeholder="10-digit mobile number" required>
<input id="regEmail" type="email" placeholder="Email address" required>
<input id="regPassword" type="password" minlength="6" placeholder="Create password (min 6 characters)" required>
<button type="submit">Create Passenger Account</button>
</form>
</div>

<div id="message" role="status"></div>
<a href="login.html">Back to login selection</a>
</div>

<script>
"use strict";

const USERS_KEY = "smartBusUsers";
const SESSION_KEY = "smartBusSession";
const ADMIN_EMAIL = "admin@smartbus.local";

function getUsers() {
    try {
        return JSON.parse(localStorage.getItem(USERS_KEY) || "[]");
    } catch (_) {
        return [];
    }
}

function showMessage(message) {
    document.getElementById("message").textContent = message;
}

function enterPassenger(user) {
    localStorage.setItem(SESSION_KEY, JSON.stringify({
        name: user.name,
        email: user.email,
        phone: user.phone || "",
        role: "passenger",
        loginAt: new Date().toISOString()
    }));

    location.replace("index.html");
}

document.getElementById("loginForm").addEventListener("submit", function(event) {
    event.preventDefault();

    const email = document.getElementById("email").value.trim().toLowerCase();
    const password = document.getElementById("password").value;

    if (email === ADMIN_EMAIL) {
        showMessage("Admin must use the separate Admin Login page.");
        return;
    }

    const user = getUsers().find(item =>
        item.email.toLowerCase() === email && item.password === password
    );

    if (!user) {
        showMessage("Invalid passenger email or password. Register if you are new.");
        return;
    }

    enterPassenger(user);
});

document.getElementById("registerForm").addEventListener("submit", function(event) {
    event.preventDefault();

    const name = document.getElementById("regName").value.trim();
    const phone = document.getElementById("regPhone").value.trim();
    const email = document.getElementById("regEmail").value.trim().toLowerCase();
    const password = document.getElementById("regPassword").value;

    if (!/^[0-9]{10}$/.test(phone)) {
        showMessage("Enter a valid 10-digit mobile number.");
        return;
    }

    if (email === ADMIN_EMAIL) {
        showMessage("This email is reserved for the administrator.");
        return;
    }

    const users = getUsers();

    if (users.some(user => user.email.toLowerCase() === email)) {
        showMessage("An account with this email already exists.");
        return;
    }

    const user = {name, phone, email, password};
    users.push(user);
    localStorage.setItem(USERS_KEY, JSON.stringify(users));

    enterPassenger(user);
});
</script>
</body>
</html>
